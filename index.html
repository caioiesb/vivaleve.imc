<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivaLeve | Calculadora de IMC Prática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator-container">
        <header class="calc-header">
            <h1>Viva<span>Leve</span></h1>
            <p>Calcule seu Índice de Massa Corporal de forma rápida e acompanhe sua saúde.</p>
        </header>

        <form id="imc-form" class="calc-form">
            <div class="input-group">
                <label for="weight">Peso (kg)</label>
                <input type="number" id="weight" step="0.1" placeholder="Ex: 75.5" required>
            </div>

            <div class="input-group">
                <label for="height">Altura (m)</label>
                <input type="number" id="height" step="0.01" placeholder="Ex: 1.75" required>
            </div>

            <button type="submit" id="btn-calculate">Calcular IMC</button>
        </form>

        <section id="result-container" class="result-container hidden">
            <hr>
            <h2>Seu Resultado</h2>
            <div class="result-value">
                <span id="imc-number">00.0</span>
                <span id="imc-status" class="status-badge">Normal</span>
            </div>
            <p id="imc-description">Você está no peso ideal. Continue assim!</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
